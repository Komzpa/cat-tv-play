name: Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pytest ruff voluptuous pillow numpy opencv-python-headless
      - run: python -m compileall custom_components tests scripts
      - run: ruff check .
      - run: pytest
