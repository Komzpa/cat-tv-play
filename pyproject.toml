[project]
name = "cat-tv-play"
version = "0.1.0"
description = "Home Assistant custom integration for Cat TV play sessions and wall-plane jump measurement"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

